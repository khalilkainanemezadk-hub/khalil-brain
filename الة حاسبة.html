
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> khalil.kainane</title>

<style>
:root {
  --bg: #10131c;
  --panel: #1b2030;
  --screen: #121724;
  --text: #fff5f5;
  --muted: #9ba5bc;
  --btn: #292f43;
  --accent: #7165f5;
  --operator: #38335e;
}
body.light {
  --bg: #e9edf5;
  --panel: #ffffff;
  --screen: #f2f4fa;
  --text: #20263a;
  --muted: #657087;
  --btn: #e7eaf3;
  --accent: #6355e7;
  --operator: #e4e0ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  transition: background .25s, color .25s;
}
.app {
  width: min(100%, 390px);
  background: var(--panel);
  border: 1px solid #8088a020;
  border-radius: 26px;
  padding: 20px;
  box-shadow: 0 24px 70px #0003;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
h1 { font-size: 19px; margin: 0; }
header button, .history-tools button {
  border: 0;
  cursor: pointer;
  color: var(--text);
  background: var(--btn);
  border-radius: 10px;
  padding: 9px 12px;
}
.display {
  background: var(--screen);
  padding: 17px;
  border-radius: 17px;
  margin-bottom: 17px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: end;
  overflow: hidden;
}
#expression {
  color: var(--muted);
  min-height: 27px;
  direction: ltr;
  text-align: left;
  overflow-wrap: anywhere;
  font-size: 17px;
}
#result {
  direction: ltr;
  text-align: left;
  font-size: clamp(28px, 8vw, 39px);
  font-weight: 700;
  overflow-wrap: anywhere;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.key {
  min-height: 57px;
  border: 0;
  border-radius: 15px;
  background: var(--btn);
  color: var(--text);
  font-size: 21px;
  font-weight: 600;
  cursor: pointer;
  transition: filter .12s, transform .12s;
}
.key:hover { filter: brightness(1.13); }
.key:active { transform: scale(.95); }
.key.operator { background: var(--operator); color: #aaa2ff; }
.key.special { color: #ff9eaa; }
.key.equal {
  background: var(--accent);
  color: white;
}
.history {
  border-top: 1px solid #8088a030;
  margin-top: 20px;
  padding-top: 14px;
}
.history-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.history h2 { font-size: 15px; margin: 0; }
.history-tools button { font-size: 12px; }
#historyList {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  max-height: 135px;
  overflow-y: auto;
}
#historyList li {
  padding: 9px 3px;
  border-bottom: 1px solid #8088a018;
  direction: ltr;
  text-align: left;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
#historyList li strong { color: var(--text); }
footer {
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  margin-top: 14px;
}
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
</style>
</head>

<body>
<main class="app">
  <header>
    <h1>⚡ آلة حاسبة khalil</h1>
    <button id="themeBtn" aria-label="تغيير المظهر">☀️</button>
  </header>

  <section class="display" aria-label="شاشة الحساب">
    <div id="expression">جاهز للحساب</div>
    <div id="result" aria-live="polite">0</div>
  </section>

  <section class="keys" aria-label="أزرار الآلة الحاسبة">
    <button class="key special" data-action="clear">AC</button>
    <button class="key special" data-action="delete">⌫</button>
    <button class="key operator" data-value="%">%</button>
    <button class="key operator" data-value="/">÷</button>

    <button class="key" data-value="7">7</button>
    <button class="key" data-value="8">8</button>
    <button class="key" data-value="9">9</button>
    <button class="key operator" data-value="*">×</button>

    <button class="key" data-value="4">4</button>
    <button class="key" data-value="5">5</button>
    <button class="key" data-value="6">6</button>
    <button class="key operator" data-value="-">−</button>

    <button class="key" data-value="1">1</button>
    <button class="key" data-value="2">2</button>
    <button class="key" data-value="3">3</button>
    <button class="key operator" data-value="+">+</button>

    <button class="key operator" data-value="(">(</button>
    <button class="key" data-value="0">0</button>
    <button class="key" data-value=".">.</button>
    <button class="key operator" data-value=")">)</button>

    <button class="key special" data-action="sign">+/−</button>
    <button class="key" data-action="copy">نسخ</button>
    <button class="key equal" data-action="equals" style="grid-column: span 2">=</button>
  </section>

  <section class="history">
    <div class="history-tools">
      <h2>🕘 سجل العمليات</h2>
      <button id="clearHistory">مسح السجل</button>
    </div>
    <ul id="historyList"></ul>
  </section>

  <footer>صنعته باستخدام HTML وCSS وJavaScript</footer>
</main>

<script>
const expressionEl = document.getElementById("expression");
const resultEl = document.getElementById("result");
const historyList = document.getElementById("historyList");

let expression = "";
let justCalculated = false;
let history = [];

try {
  history = JSON.parse(localStorage.getItem("calcHistory") || "[]");
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

function formatNumber(number) {
  if (!Number.isFinite(number)) throw Error("نتيجة غير صالحة");
  if (Object.is(number, -0)) number = 0;
  return Number(number.toPrecision(12)).toString();
}

// محلل حسابي آمن، دون استعمال eval
function calculate(input) {
  const tokens = input.match(
    /(?:\d+\.?\d*|\.\d+)|[+\-*/()%]/g
  ) || [];

  if (tokens.join("") !== input.replace(/\s/g, "")) {
    throw Error("تحقق من التعبير");
  }

  let pos = 0;

  function peek() { return tokens[pos]; }
  function take() { return tokens[pos++]; }

  function primary() {
    const token = peek();
    let value;

    if (token === "+" || token === "-") {
      take();
      value = primary();
      return token === "-" ? -value : value;
    }

    if (token === "(") {
      take();
      value = addSub();
      if (take() !== ")") throw Error("قوس غير مغلق");
    } else if (token && /^(\d+\.?\d*|\.\d+)$/.test(token)) {
      take();
      value = Number(token);
    } else {
      throw Error("تعبير غير مكتمل");
    }

    while (peek() === "%") {
      take();
      value /= 100;
    }

    return value;
  }

  function mulDiv() {
    let value = primary();

    while (peek() === "*" || peek() === "/") {
      const op = take();
      const right = primary();

      if (op === "/" && right === 0) {
        throw Error("لا يمكن القسمة على صفر");
      }

      value = op === "*" ? value * right : value / right;
    }
    return value;
  }

  function addSub() {
    let value = mulDiv();

    while (peek() === "+" || peek() === "-") {
      const op = take();
      const right = mulDiv();
      value = op === "+" ? value + right : value - right;
    }
    return value;
  }

  if (!tokens.length) throw Error("أدخل عملية أولاً");

  const answer = addSub();
  if (pos !== tokens.length) throw Error("تحقق من الأقواس");
  if (!Number.isFinite(answer)) throw Error("نتيجة كبيرة جدًا");

  return answer;
}

function updateDisplay() {
  expressionEl.textContent = expression || "جاهز للحساب";

  if (!expression) {
    resultEl.textContent = "0";
    return;
  }

  try {
    resultEl.textContent = formatNumber(calculate(expression));
  } catch {
    resultEl.textContent = "…";
  }
}

function addValue(value) {
  if (justCalculated && /[\d.(]/.test(value)) {
    expression = "";
  }
  justCalculated = false;

  if (expression.length >= 100) return;
  expression += value;
  updateDisplay();
}

function clearAll() {
  expression = "";
  justCalculated = false;
  updateDisplay();
}

function deleteLast() {
  expression = expression.slice(0, -1);
  justCalculated = false;
  updateDisplay();
}

function toggleSign() {
  if (!expression) {
    expression = "-";
  } else if (/^-?\d*\.?\d+$/.test(expression)) {
    expression = expression.startsWith("-")
      ? expression.slice(1)
      : "-" + expression;
  } else {
    expression = "-(" + expression + ")";
  }

  justCalculated = false;
  updateDisplay();
}

function saveHistory(item) {
  history.unshift(item);
  history = history.slice(0, 20);

  try {
    localStorage.setItem("calcHistory", JSON.stringify(history));
  } catch {}

  renderHistory();
}

function renderHistory() {
  historyList.replaceChildren();

  history.forEach(item => {
    const li = document.createElement("li");
    const line = document.createElement("div");
    const answer = document.createElement("strong");

    line.textContent = item.expression + " =";
    answer.textContent = " " + item.result;

    li.append(line, answer);
    li.title = "اضغط لإعادة العملية";
    li.style.cursor = "pointer";

    li.addEventListener("click", () => {
      expression = item.expression;
      justCalculated = false;
      updateDisplay();
    });

    historyList.appendChild(li);
  });
}

function equals() {
  if (!expression) return;

  try {
    const original = expression;
    const answer = formatNumber(calculate(original));

    expressionEl.textContent = original + " =";
    resultEl.textContent = answer;
    saveHistory({ expression: original, result: answer });

    expression = answer;
    justCalculated = true;
  } catch (error) {
    resultEl.textContent = error.message;
  }
}

document.querySelector(".keys").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;

  const { value, action } = button.dataset;

  if (value !== undefined) addValue(value);

  if (action === "clear") clearAll();
  if (action === "delete") deleteLast();
  if (action === "sign") toggleSign();
  if (action === "equals") equals();

  if (action === "copy") {
    const text = resultEl.textContent;
    if (text !== "…" && !text.includes("لا يمكن")) {
      navigator.clipboard?.writeText(text).catch(() => {});
    }
  }
});

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  document.getElementById("themeBtn").textContent = light ? "🌙" : "☀️";
});

document.getElementById("clearHistory").addEventListener("click", () => {
  history = [];
  try { localStorage.removeItem("calcHistory"); } catch {}
  renderHistory();
});

document.addEventListener("keydown", event => {
  if (/^[0-9.]$/.test(event.key)) addValue(event.key);
  else if (["+", "-", "*", "/", "(", ")", "%"].includes(event.key)) {
    addValue(event.key);
  } else if (event.key === "Enter" || event.key === "=") {
    event.preventDefault();
    equals();
  } else if (event.key === "Backspace") deleteLast();
  else if (event.key === "Escape") clearAll();
});

renderHistory();
updateDisplay();
</script>
</body>
</html>
